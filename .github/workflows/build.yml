name: Build APK
on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip any zip files
        run: |
          for z in ./*.zip; do
            [ -e "$z" ] && unzip -q -o "$z"
          done
          true

      - name: Find project directory
        run: |
          f=$(find . -name 'settings.gradle*' -not -path '*/.git/*' | head -1)
          if [ -z "$f" ]; then echo "No Gradle project found"; exit 1; fi
          echo "PROJECT_DIR=$(dirname "$f")" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build
        run: gradle assembleDebug --no-daemon
        working-directory: ${{ env.PROJECT_DIR }}

      - uses: actions/upload-artifact@v4
        with:
          name: APK
          path: ${{ env.PROJECT_DIR }}/**/build/outputs/apk/debug/*.apk
